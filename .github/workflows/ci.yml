# actions/checkout pinned to the v7.0.1 tag commit (verified against
# https://github.com/actions/checkout/releases/tag/v7.0.1 and the GitHub
# git refs API on 2026-11-21). Shellcheck is installed from Ubuntu packages
# so this workflow does not depend on a third-party action.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck and perl
        run: sudo apt-get update && sudo apt-get install -y shellcheck perl

      - name: Run tests
        run: bash tests/run-tests.sh

      - name: Run live response and history tests
        run: bash tests/run-live-tests.sh

      - name: Run live response tests under PowerShell 7
        run: bash tests/run-live-ps1-tests.sh

      - name: Perl syntax
        run: |
          for f in lib/*.pl lib/PRG.pm; do perl -Ilib -c "$f"; done

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; exit 1 }
          }

      - name: Shellcheck
        run: |
          shellcheck -x \
            scan-repo.sh \
            host-check.sh \
            live-respond.sh \
            history-report.sh \
            safe-clone.sh \
            safe-pull.sh \
            safe-install.sh \
            install-hooks.sh \
            apply-dev-defaults.sh \
            update-iocs.sh \
            tests/run-tests.sh \
            tests/run-live-tests.sh \
            tests/run-live-ps1-tests.sh \
            hooks/*
